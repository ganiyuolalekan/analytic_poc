[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data", "organization_logos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E702", "B008", "UP038", "B905", "E741", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]
"scripts/make_share_report.py" = ["E702", "E402", "B023"]
"scripts/*" = ["E402"]
"nsw_sim/money.py" = ["UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (full backfill, live LLM eval)",
  "live_llm: calls the real model (reuses the cache)",
]
filterwarnings = ["ignore::DeprecationWarning"]
